name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mirrors the repo's own build chain via the shared `build:all` script (the
# same one prepublishOnly runs) — keeping CI and the release pipeline on ONE
# literal step sequence (final-review F-4). 10 of the 21 test suites pin the
# BUILT artifacts (dist/patch.js, companion/dist/extension.js), which are
# gitignored: a fresh checkout has none, so build BEFORE test.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      # --ignore-scripts skips the husky `prepare` hook (dev-only). Every
      # dependency the suites need lives in devDependencies (tsx/prettier/
      # typescript); companion deps install via companion:install (npm ci).
      - run: npm ci --ignore-scripts
      - run: npm run build:all
      - run: npm run format:check
      - run: npm test
