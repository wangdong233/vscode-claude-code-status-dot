name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips the husky `prepare` hook (dev-only).
      # Build BEFORE testing: 10 of the 21 suites pin the BUILT artifacts
      # (dist/patch.js, companion/dist/extension.js), which are gitignored —
      # a fresh checkout has none. This mirrors the repo's own prepublish
      # chain (minus vsix packaging).
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run companion:install
      - run: npm run companion:build
      - run: npm run format:check
      - run: npm test
